# SMILELAND — Cloudflare Workers config
name = "smileland"
main = "src/index.tsx"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = false

[observability]
enabled = true

[vars]
SITE_NAME = "SMILELAND"
SITE_URL = "https://xn--q3ca1a3aod6acw1c9je.com"
IMG_BASE = "/img"                     # production: https://img.<โดเมน> (R2 custom domain)
# Turnstile test site key (ผ่านทุกครั้ง) — production เปลี่ยนเป็น site key จริง
TURNSTILE_SITE_KEY = "0x4AAAAAAFjYuQwghWZlM5Tc"
LISTING_TTL_DAYS = "180"
THIN_PAGE_MIN = "3"

[[d1_databases]]
binding = "DB"
database_name = "smileland-db"
database_id = "ff7b7083-fb87-4f5e-b2a4-82c4ec54a5f6" # ← ใส่ค่าจาก `wrangler d1 create smileland-db`
migrations_dir = "migrations"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "smileland-uploads"

[[kv_namespaces]]
binding = "SESSIONS"
id = "e984af6c856d401e8d48a56a9c805e28" # ← ใส่ค่าจาก `wrangler kv namespace create SESSIONS`

[[kv_namespaces]]
binding = "RATELIMIT"
id = "e1d7f5497900499793299bfb00fb668f" # ← ใส่ค่าจาก `wrangler kv namespace create RATELIMIT`

[[queues.producers]]
binding = "JOBS"
queue = "sitemap-jobs"

[[queues.consumers]]
queue = "sitemap-jobs"
max_batch_size = 10
max_batch_timeout = 30

[triggers]
crons = ["17 19 * * *"] # 02:17 น. เวลาไทยทุกวัน: หมดอายุประกาศ + สร้าง sitemap
